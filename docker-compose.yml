services:
  # Service 1: PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: expense-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: daily-expense
    # Hanya bind ke localhost (untuk make migrate-up), tidak dipublikasikan ke jaringan luar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily-expense"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service 2: Golang Backend
  api:
    build:
      context: ./daily-expense-backend
    # Image di-build oleh GitHub Actions lalu di-push ke GHCR.
    # Lokal: docker compose up --build | VPS: docker compose pull
    image: ghcr.io/fildansyah/daily-expense-api
    container_name: expense-api
    restart: always
    environment:
      # PENTING: Host bukan localhost lagi, tapi nama service database ("db")
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=daily-expense
      - DB_PORT=5432
      - PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Wajib: tanpa ini container API sengaja gagal start.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET wajib diisi di .env}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-168h}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-Lax}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Service 3: Next.js Frontend
  web:
    build:
      context: ./daily-expense-frontend
      args:
        # NEXT_PUBLIC_* di-inline saat build, jadi harus lewat build args
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    image: ghcr.io/fildansyah/daily-expense-web
    container_name: expense-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api

# Volume untuk memastikan data database tidak hilang saat container mati
volumes:
  pgdata:
